services:

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8081"
    environment:
      JWT_SECRET: disk-service-dev-secret-change-in-production
      JWT_EXPIRATION_HOURS: "24"
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin123
      ADMIN_FIRST_NAME: Admin
      ADMIN_LAST_NAME: User
    command: ["/cloud-storage/build_debug/user-service",
              "--config", "/cloud-storage/configs/user-service/config.yaml",
              "--config_vars", "/cloud-storage/configs/user-service/config_vars.yaml"]

  folder-file-service:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8082"
    environment:
      JWT_SECRET: disk-service-dev-secret-change-in-production
      JWT_EXPIRATION_HOURS: "24"
    command: ["/cloud-storage/build_debug/folder-file-service",
              "--config", "/cloud-storage/configs/folder-file-service/config.yaml",
              "--config_vars", "/cloud-storage/configs/folder-file-service/config_vars.yaml"]

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - folder-file-service

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8081:8080"
    volumes:
      - ./openapi.yaml:/tmp/openapi.yaml:ro
    environment:
      SWAGGER_JSON: /tmp/openapi.yaml
