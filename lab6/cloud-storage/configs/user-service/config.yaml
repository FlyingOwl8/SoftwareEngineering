components_manager:
  task_processors:
    main-task-processor:
      worker_threads: $worker_threads
    fs-task-processor:
      worker_threads: 2

  default_task_processor: main-task-processor

  components:
    server:
      listener:
        port: $server_port
        task_processor: main-task-processor

    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stderr'
          level: $log_level
          overflow_behavior: discard

    tracer:
      service-name: user-service

    handler-auth-register:
      path: /api/v1/auth/register
      method: POST
      task_processor: main-task-processor

    handler-auth-login:
      path: /api/v1/auth/login
      method: POST
      task_processor: main-task-processor

    handler-users-get-by-login:
      path: /api/v1/users/{login}
      method: GET
      task_processor: main-task-processor
      auth:
        types:
          - jwt-auth

    handler-users-search:
      path: /api/v1/users
      method: GET
      task_processor: main-task-processor
      auth:
        types:
          - jwt-auth

    handler-users-cache-stats:
      path: /api/v1/users/cache-stats
      method: GET
      task_processor: main-task-processor

    jwt-auth-checker:
      load-enabled: true

    user-service-logic:
      load-enabled: true
      use_postgres: $postgres_enabled

    testsuite-support:
      load-enabled: true

    dns-client:
      fs-task-processor: fs-task-processor

    postgres-db:
      dbconnection: "postgresql://postgres:XXXXXXXX@postgres-db:5432/cloud_storage?sslmode=disable&gssencmode=disable"
      blocking_task_processor: fs-task-processor
      dns_resolver: async
      load-enabled: $postgres_enabled
