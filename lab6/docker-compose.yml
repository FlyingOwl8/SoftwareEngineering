services:

  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: XXXXXXXX
      POSTGRES_DB: cloud_storage
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../lab3/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../lab3/data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloud_storage"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:5
    volumes:
      - mongo_data:/data/db
      - ../lab4/data.js:/docker-entrypoint-initdb.d/data.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "kafka-topics"
      - "--bootstrap-server"
      - "kafka:9092"
      - "--create"
      - "--if-not-exists"
      - "--topic"
      - "folder-events"
      - "--partitions"
      - "1"
      - "--replication-factor"
      - "1"

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8081"
    environment:
      JWT_SECRET: disk-service-dev-secret-change-in-production
      JWT_EXPIRATION_HOURS: "24"
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin123
      ADMIN_FIRST_NAME: Admin
      ADMIN_LAST_NAME: User
    volumes:
      - ../lab3/configs/user-service/config_vars.yaml:/cloud-storage/configs/user-service/config_vars.yaml:ro
    command:
      - "/cloud-storage/build_debug/user-service"
      - "--config"
      - "/cloud-storage/configs/user-service/config.yaml"
      - "--config_vars"
      - "/cloud-storage/configs/user-service/config_vars.yaml"
    depends_on:
      postgres-db:
        condition: service_healthy

  folder-file-service:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8082"
    environment:
      JWT_SECRET: disk-service-dev-secret-change-in-production
      JWT_EXPIRATION_HOURS: "24"
    volumes:
      - ./cloud-storage/configs/folder-file-service/config.yaml:/cloud-storage/configs/folder-file-service/config.yaml:ro
      - ./configs/folder-file-service/config_vars.yaml:/cloud-storage/configs/folder-file-service/config_vars.yaml:ro
      - ./configs/secdist/secdist.json:/etc/cloud-storage/secdist.json:ro
    command:
      - "/cloud-storage/build_debug/folder-file-service"
      - "--config"
      - "/cloud-storage/configs/folder-file-service/config.yaml"
      - "--config_vars"
      - "/cloud-storage/configs/folder-file-service/config_vars.yaml"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  folder-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    environment: {}
    volumes:
      - ./cloud-storage/configs/folder-consumer/config.yaml:/cloud-storage/configs/folder-consumer/config.yaml:ro
      - ./configs/folder-consumer/config_vars.yaml:/cloud-storage/configs/folder-consumer/config_vars.yaml:ro
      - ./configs/secdist/secdist.json:/etc/cloud-storage/secdist.json:ro
    command:
      - "/cloud-storage/build_debug/folder-consumer"
      - "--config"
      - "/cloud-storage/configs/folder-consumer/config.yaml"
      - "--config_vars"
      - "/cloud-storage/configs/folder-consumer/config_vars.yaml"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ../lab2/configs/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - folder-file-service

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8081:8080"
    volumes:
      - ../lab2/openapi.yaml:/tmp/openapi.yaml:ro
    environment:
      SWAGGER_JSON: /tmp/openapi.yaml

volumes:
  postgres_data:
  mongo_data:
  kafka_data:
